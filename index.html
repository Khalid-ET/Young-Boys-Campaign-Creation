<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YB.Jr — Campaign Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12122b;
    --panel:#191938;
    --panel-2:#20204a;
    --line: rgba(253,251,247,0.10);
    --marigold:#ffb627;
    --coral:#ff6b6b;
    --mint:#4ecdc4;
    --text:#fdfbf7;
    --muted:#a7a7c9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(900px 500px at 90% -10%, rgba(255,182,39,0.10), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(78,205,196,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    min-height:100vh;
  }
  ::selection{background:var(--marigold);color:#12122b;}

  /* ===== Sidebar ===== */
  .sidebar{
    width:320px;
    min-width:280px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:24px 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
    overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--marigold),var(--coral));
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;
    font-size:18px;color:#191938;flex-shrink:0;
    transform:rotate(-4deg);
  }
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;line-height:1.1;}
  .brand-tag{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}

  .section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:10px;display:block;
  }

  .brief-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
  }
  .brief-field{margin-bottom:10px;}
  .brief-field:last-child{margin-bottom:0;}
  .brief-field label{
    display:block;font-size:10.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;
    font-family:'JetBrains Mono',monospace;
  }
  .brief-field input, .brief-field textarea{
    width:100%;background:#14142e;border:1px solid var(--line);
    color:var(--text);border-radius:8px;padding:7px 9px;font-size:12.5px;
    font-family:'Inter',sans-serif;resize:vertical;
  }
  .brief-field input:focus, .brief-field textarea:focus{outline:2px solid var(--mint);outline-offset:1px;}
  .brief-field textarea{min-height:44px;line-height:1.4;}

  .tools{display:flex;flex-direction:column;gap:8px;}
  .tool-btn{
    display:flex;align-items:center;gap:10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    color:var(--text);
    cursor:pointer;
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:13px;font-weight:600;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .tool-btn:hover{border-color:var(--marigold);transform:translateX(2px);}
  .tool-btn:active{transform:scale(.98);}
  .tool-btn .ico{
    width:30px;height:30px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .tool-btn .sub{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:1px;}
  .ico.poster{background:rgba(255,107,107,.18);}
  .ico.cal{background:rgba(255,182,39,.18);}
  .ico.cat{background:rgba(78,205,196,.18);}
  .ico.feed{background:rgba(167,167,201,.18);}

  .tone-row{display:flex;gap:6px;flex-wrap:wrap;}
  .tone-chip{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;padding:5px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);cursor:pointer;background:transparent;
  }
  .tone-chip.active{background:var(--mint);color:#12122b;border-color:var(--mint);font-weight:600;}

  /* ===== Main chat column ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-header{
    padding:16px 28px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(25,25,56,0.6);backdrop-filter:blur(6px);
  }
  .chat-header h1{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0;font-weight:700;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--mint);}
  .status{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

  .chat-messages{
    flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:16px;
    max-width:900px;width:100%;margin:0 auto;
  }
  .msg{display:flex;gap:12px;max-width:100%;}
  .msg.user{flex-direction:row-reverse;}
  .avatar{
    width:34px;height:34px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
  }
  .avatar.bot{background:linear-gradient(135deg,var(--marigold),var(--coral));color:#191938;}
  .avatar.user{background:var(--panel-2);border:1px solid var(--line);color:var(--mint);}
  .bubble{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:13px 16px;font-size:14px;line-height:1.6;max-width:78%;
  }
  .msg.user .bubble{background:var(--panel-2);}
  .msg.bot .bubble{border-top-left-radius:4px;}
  .msg.user .bubble{border-top-right-radius:4px;}
  .bubble ul{margin:6px 0;padding-left:18px;}
  .bubble li{margin-bottom:4px;}
  .bubble h3,.bubble h4{font-family:'Space Grotesk',sans-serif;margin:4px 0 6px;color:var(--marigold);}
  .bubble strong{color:var(--mint);}
  .bubble .rhyme-hint{color:var(--muted);}

  .typing{display:flex;gap:4px;padding:4px 0;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}

  .composer{
    border-top:1px solid var(--line);padding:16px 28px 22px;
    background:rgba(25,25,56,0.6);
  }
  .composer-inner{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
  .composer textarea{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:14px;padding:12px 14px;font-size:14px;font-family:'Inter',sans-serif;
    resize:none;min-height:46px;max-height:140px;line-height:1.4;
  }
  .composer textarea:focus{outline:2px solid var(--mint);outline-offset:1px;}
  .send-btn{
    background:linear-gradient(135deg,var(--marigold),var(--coral));
    border:none;border-radius:14px;width:46px;height:46px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:#191938;font-size:18px;
  }
  .send-btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ===== Poster card ===== */
  .poster-wrap{max-width:78%;}
  .poster-card{
    border-radius:14px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  /* FIX: SVGs carry a fixed intrinsic size (width="600" height="H") so the
     browser won't shrink them to the card automatically. Forcing them to
     scale with the container (using their viewBox to stay proportional)
     stops the card from clipping/overlapping the design. */
  .poster-card svg{
    display:block;
    width:100%;
    height:auto;
  }
  .poster-actions{display:flex;gap:8px;margin-top:8px;}
  .poster-actions button{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:6px 11px;border-radius:8px;cursor:pointer;
  }
  .poster-actions button:hover{border-color:var(--mint);}

  /* ===== Overlay detail page ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(10,10,26,.72);
    display:flex;align-items:center;justify-content:center;z-index:50;
    backdrop-filter:blur(3px);
  }
  .overlay.hidden{display:none;}
  .detail-page{
    width:min(720px,92vw);max-height:86vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:0;
  }
  .detail-head{
    padding:20px 26px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;background:var(--panel);
  }
  .detail-head h2{font-family:'Space Grotesk',sans-serif;margin:0;font-size:18px;}
  .detail-head .chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);}
  .close-btn{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:15px;}
  .detail-body{padding:22px 26px 30px;font-size:14px;line-height:1.7;}
  .detail-body ul{padding-left:20px;}
  .detail-body li{margin-bottom:6px;}
  .detail-body h3{font-family:'Space Grotesk',sans-serif;color:var(--marigold);margin:20px 0 8px;font-size:15px;}
  .detail-body h3:first-child{margin-top:0;}
  .detail-body strong{color:var(--mint);}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--panel-2);border-radius:6px;}

  @media (max-width:820px){
    body{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;}
    .bubble,.poster-wrap{max-width:92%;}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">YB</div>
    <div>
      <div class="brand-name">YB.Jr</div>
      <div class="brand-tag">Campaign Copilot</div>
    </div>
  </div>

  <div>
    <span class="section-label">Your campaign brief</span>
    <div class="brief-card">
      <div class="brief-field">
        <label>Organization</label>
        <input id="f-org" value="Youth Coding Initiative">
      </div>
      <div class="brief-field">
        <label>Campaign name</label>
        <input id="f-campaign" value="Code Your Future 2024">
      </div>
      <div class="brief-field">
        <label>Goal</label>
        <input id="f-goal" value="Raise $50,000 for free coding camps for underserved teens">
      </div>
      <div class="brief-field">
        <label>Target audience</label>
        <textarea id="f-audience">Parents of middle/high schoolers, local businesses, corporate donors, education foundations, community leaders</textarea>
      </div>
      <div class="brief-field">
        <label>Key messages</label>
        <textarea id="f-messages">Every teen deserves access to tech ed regardless of income. Coding skills equal future job opportunities. Camps are 100% free. 90% of students pursue tech careers.</textarea>
      </div>
      <div class="brief-field">
        <label>Timeline</label>
        <input id="f-timeline" value="6 weeks: May 15 – June 30, 2024">
      </div>
      <div class="brief-field">
        <label>Platforms</label>
        <input id="f-platforms" value="Instagram, Facebook, LinkedIn, Email, Local Press, Crowdfunding page">
      </div>
    </div>
  </div>

  <div>
    <span class="section-label">Poster customization</span>
    <div class="brief-card">
      <div class="brief-field">
        <label>Brand colors / visual style (optional)</label>
        <input id="f-brandcolors" placeholder="e.g. earth tones: green, brown, cream">
      </div>
      <div class="brief-field">
        <label>Poster style preference (optional)</label>
        <input id="f-posterpref" placeholder="e.g. playful, minimal, bold typography">
      </div>
    </div>
  </div>

  <div>
    <span class="section-label">Vibe / tone</span>
    <div class="tone-row" id="toneRow">
      <button class="tone-chip active" data-tone="Inspiring but not desperate, warm, hopeful">Inspiring</button>
      <button class="tone-chip" data-tone="Playful, upbeat, energetic">Playful</button>
      <button class="tone-chip" data-tone="Professional, polished, corporate-ready">Professional</button>
      <button class="tone-chip" data-tone="Urgent, deadline-driven, action-now">Urgent</button>
    </div>
  </div>

  <div>
    <span class="section-label">Toolkit</span>
    <div class="tools">
      <button class="tool-btn" onclick="runTool('poster')">
        <span class="ico poster">🎨</span>
        <span>Poster Generator<span class="sub">Render a campaign poster</span></span>
      </button>
      <button class="tool-btn" onclick="runTool('calendar')">
        <span class="ico cal">🗓️</span>
        <span>Content Calendar<span class="sub">Week-by-week posting plan</span></span>
      </button>
      <button class="tool-btn" onclick="runTool('categorizer')">
        <span class="ico cat">📊</span>
        <span>Platform Categorizer<span class="sub">Where to focus your energy</span></span>
      </button>
      <button class="tool-btn" onclick="runTool('feedback')">
        <span class="ico feed">📈</span>
        <span>Feedback Monitor<span class="sub">Growth check + next steps</span></span>
      </button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="chat-header">
    <h1>YB.Jr — your social campaign sidekick</h1>
    <span class="status"><span class="status-dot"></span>ready to build with you</span>
  </div>
  <div class="chat-messages" id="chat"></div>
  <div class="composer">
    <div class="composer-inner">
      <textarea id="input" placeholder="Ask YB.Jr for anything campaign-related..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</main>

<div class="overlay hidden" id="overlay">
  <div class="detail-page">
    <div class="detail-head">
      <h2 id="detailTitle">Detail page</h2>
      <button class="close-btn" onclick="closeOverlay()">✕</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let currentTone = "Inspiring but not desperate, warm, hopeful";

document.getElementById('toneRow').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tone-chip');
  if(!btn) return;
  document.querySelectorAll('.tone-chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  currentTone = btn.dataset.tone;
});

inputEl.addEventListener('input', ()=>{
  inputEl.style.height='auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight,140)+'px';
});
inputEl.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

function getBrief(){
  return {
    org: document.getElementById('f-org').value,
    campaign: document.getElementById('f-campaign').value,
    goal: document.getElementById('f-goal').value,
    audience: document.getElementById('f-audience').value,
    messages: document.getElementById('f-messages').value,
    timeline: document.getElementById('f-timeline').value,
    platforms: document.getElementById('f-platforms').value,
    brandColors: document.getElementById('f-brandcolors').value,
    posterPref: document.getElementById('f-posterpref').value,
  };
}

function briefBlock(){
  const b = getBrief();
  return `Organization: ${b.org}
Campaign: ${b.campaign}
Goal: ${b.goal}
Target audience: ${b.audience}
Key messages: ${b.messages}
Timeline: ${b.timeline}
Platforms: ${b.platforms}
Brand colors / visual style: ${b.brandColors || 'not specified -- choose a fitting palette'}
Poster style preference: ${b.posterPref || 'not specified -- use your best judgment for the tone below'}
Desired tone right now: ${currentTone}`;
}

const BASE_PERSONA = `You are YB.Jr, a friendly AI chatbot living on a small business's website. Your job: help small businesses and non-profits plan, create, and monitor social media content campaigns — you assist with campaign strategy, content calendars, platform selection, poster/creative copy, and performance feedback.

VOICE RULES (never break these):
- Every single sentence you write must end on a rhyme with the sentence before it, or otherwise land on a rhyming word pair within your reply — write in a light, bouncy, rhyming cadence throughout, like a friendly jingle-writer. Never sacrifice clarity for the rhyme; if a rhyme would make you say something false or confusing, choose the closest natural rhyme instead of forcing nonsense.
- Tone is polite, warm, and encouraging, and adapts to whatever tone the user asks for (playful, professional, urgent, etc.) while keeping the rhyme habit.
- Greet with a salutation whenever you open a conversation or a new topic (e.g. "Hello there," "Hey friend,").
- Audience is enthusiastic small business owners and non-profits who are short on time, budget, and expertise — be encouraging, never condescending, and keep jargon low.
- Recommendations and lists must be formatted as bullet points.
- If a request is truly impossible or outside your scope (not related to social media campaign creation for this business), reply with EXACTLY this and nothing else: "🆗 I can't help you with that, but I can build you a potential poster for your business, and that's no jive!"

ADDITIONAL ROLE — Campaign Refinement Specialist:
Play the role of a campaign refinement specialist and assist with the needs of users when redesigning or refining their campaign. Whenever the user raises a concern or asks to change, tighten up, or rework any part of their campaign (goal, audience, key messages, tone, timeline, or platforms), review the concern against the current campaign brief above and make the necessary changes to meet the user's needs — propose specific, concrete edits and name the exact brief field(s) each change affects (e.g. "Goal", "Target audience", "Key messages") so the user can update the sidebar themselves. Keep the bullet-point and rhyme rules above while doing this. If the user's concern is about refining/redesigning their campaign but genuinely falls outside what you're able to help with (e.g. it needs real-time analytics, legal or financial advice, or direct access to design software), reply with EXACTLY this and nothing else: "sorry, I can't help you with that, but I can assist in other matters, campaign related."

Stay strictly on-topic: social media content campaign creation, strategy, calendars, monitoring, creative content, and campaign refinement. Keep replies focused and skimmable.`;

function addMessage(role, html, extraClass=''){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + role;
  avatar.textContent = role==='bot' ? '🎤' : '🙂';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + extraClass;
  bubble.innerHTML = html;
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function addTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id='typingRow';
  wrap.innerHTML = `<div class="avatar bot">🎤</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function removeTyping(){
  const t = document.getElementById('typingRow');
  if(t) t.remove();
}

function mdToHtml(text){
  // lightweight markdown-ish renderer: **bold**, headers "## ", bullets "- "
  const lines = text.split('\n');
  let html = '';
  let inList = false;
  for(let raw of lines){
    let line = raw.trim();
    if(line === ''){ if(inList){html+='</ul>';inList=false;} continue; }
    if(/^#{1,4}\s+/.test(line)){
      if(inList){html+='</ul>';inList=false;}
      const clean = line.replace(/^#{1,4}\s+/,'');
      html += `<h4>${inlineMd(clean)}</h4>`;
      continue;
    }
    if(/^[-*•]\s+/.test(line)){
      if(!inList){html+='<ul>';inList=true;}
      html += `<li>${inlineMd(line.replace(/^[-*•]\s+/,''))}</li>`;
      continue;
    }
    if(inList){html+='</ul>';inList=false;}
    html += `<p>${inlineMd(line)}</p>`;
  }
  if(inList) html+='</ul>';
  return html;
}
function inlineMd(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

async function callClaude(system, userText, maxTokens=1000){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens,
      system: system,
      messages: [{ role: "user", content: userText }],
    })
  });
  const data = await response.json();
  const textBlocks = (data.content || []).filter(b=>b.type==='text').map(b=>b.text);
  return textBlocks.join('\n').trim();
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  addMessage('user', escapeHtml(text));
  inputEl.value=''; inputEl.style.height='auto';
  sendBtn.disabled = true;
  addTyping();
  try{
    const system = BASE_PERSONA + `\n\nCurrent campaign brief for this business:\n${briefBlock()}`;
    const reply = await callClaude(system, text);
    removeTyping();
    if(reply.startsWith('🆗') || reply.toLowerCase().startsWith('sorry, i can\'t help you with that')){
      addMessage('bot', escapeHtml(reply));
    } else {
      addMessage('bot', mdToHtml(reply));
    }
  }catch(err){
    removeTyping();
    addMessage('bot', "🆗 Whoops, my wires got tangled up somehow, but I'm still here and ready right now — try me again in just a beat!");
    console.error(err);
  }
  sendBtn.disabled = false;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

/* ===================== TOOLKIT ===================== */

async function runTool(kind){
  if(kind==='poster') return generatePoster();
  if(kind==='calendar') return generateDetailPage('calendar');
  if(kind==='categorizer') return generateDetailPage('categorizer');
  if(kind==='feedback') return generateDetailPage('feedback');

const PALETTES = [
  {bg:'#191938', accent:'#ffb627', accent2:'#ff6b6b', text:'#fdfbf7'},
  {bg:'#122019', accent:'#4ecdc4', accent2:'#ffb627', text:'#fdfbf7'},
  {bg:'#2a1230', accent:'#ff6b6b', accent2:'#4ecdc4', text:'#fdfbf7'},
];

function isValidHex(s){
  return typeof s === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(s.trim());
}
function safePalette(pal, fallbackIndex){
  const fb = PALETTES[fallbackIndex % PALETTES.length];
  if(!pal) return fb;
  return {
    bg: isValidHex(pal.bg) ? pal.bg : fb.bg,
    accent: isValidHex(pal.accent) ? pal.accent : fb.accent,
    accent2: isValidHex(pal.accent2) ? pal.accent2 : fb.accent2,
    text: isValidHex(pal.text) ? pal.text : fb.text,
  };
}

function escXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function wrapSvgText(text, fontApprox, maxWidth, maxLines=3){
  // naive char-count based wrap, with ellipsis truncation if it still overflows maxLines
  const maxChars = Math.max(8, Math.floor(maxWidth / (fontApprox*0.56)));
  const words = String(text).split(' ').filter(Boolean);
  const lines = [];
  let cur = '';
  for(const w of words){
    if((cur+' '+w).trim().length > maxChars){ if(cur) lines.push(cur.trim()); cur = w; }
    else cur = (cur+' '+w).trim();
  }
  if(cur) lines.push(cur.trim());
  if(lines.length > maxLines){
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines-1];
    if(last.length > 3) last = last.slice(0, last.length-1).trim();
    kept[maxLines-1] = last + '…';
    return kept;
  }
  return lines.length ? lines : [''];
}

/*
  Layout notes (design principles borrowed from strong poster references,
  not copied 1:1 -- reinterpreted as reusable layout rules):
  - Generous negative space between sections instead of cramming edge to edge
  - A single asymmetric diagonal accent zone up top for visual energy, echoing
    color-blocked poster compositions, kept separate from the body copy zone
  - One clear left-aligned hierarchy: eyebrow -> headline -> accent rule ->
    subheadline -> stat -> CTA -> footer, each vertically spaced based on the
    ACTUAL rendered height of the block before it, so nothing can overlap
  - A minimal stat treatment (thin accent bar + big number) instead of a heavy
    boxed callout, to keep things feeling open rather than cluttered
  - A quiet footer with a thin divider rule, mirroring the small/low-emphasis
    contact-info treatment used in clean flyer layouts
*/
function buildPosterSvg(data, palette, id){
  const p = palette;
  const W = 600;
  const marginX = 46;
  const contentW = W - marginX*2;

  // ---- Eyebrow ----
  const eyebrowText = (data.eyebrow||'CAMPAIGN').toUpperCase();
  const eyebrowW = Math.min(260, Math.max(140, eyebrowText.length*8 + 40));
  const eyebrowY = 56;
  let cursorY = eyebrowY + 30 + 30;

  // ---- Headline (max 2 lines, dynamically sized block) ----
  const headlineLines = wrapSvgText(data.headline || 'Your Campaign', 40, contentW, 2);
  const headlineLineH = 46;
  const headlineStartY = cursorY + 34;
  cursorY = headlineStartY + (headlineLines.length - 1) * headlineLineH + 20;
  const ruleY = cursorY;
  cursorY += 34;

  // ---- Subheadline (max 2 lines) ----
  const subLines = wrapSvgText(data.subheadline || '', 16, contentW, 2);
  const subLineH = 23;
  const subStartY = cursorY + 12;
  cursorY = subStartY + (subLines.length - 1) * subLineH + 46;

  // ---- Stat (minimalist: accent bar + big number, no heavy box) ----
  const statBarY = cursorY;
  const statNumberY = statBarY + 52;
  const statLabelY = statNumberY + 24;
  cursorY = statLabelY + 46;

  // ---- CTA ----
  const ctaText = data.cta || 'Learn more';
  const ctaW = Math.min(340, Math.max(170, ctaText.length * 9 + 60));
  const ctaY = cursorY;
  cursorY = ctaY + 52 + 44;

  // ---- Footer ----
  const dividerY = cursorY;
  const footerY = dividerY + 26;
  cursorY = footerY + 34;

  const H = Math.max(680, Math.min(860, Math.round(cursorY)));
  const headerPanelH = 220;

  return `
  <svg id="${id}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Space Grotesk, Inter, sans-serif">
    <rect width="${W}" height="${H}" fill="${p.bg}"/>

    <!-- asymmetric diagonal accent zone, kept behind the header copy only -->
    <polygon points="0,0 ${W},0 ${W},${headerPanelH-70} 0,${headerPanelH}" fill="${p.accent}" opacity="0.10"/>
    <polygon points="0,0 ${W},0 ${W},${headerPanelH-70} 0,${headerPanelH}" fill="none" stroke="${p.accent2}" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="${W-70}" cy="66" r="88" fill="${p.accent2}" opacity="0.10"/>

    <!-- eyebrow -->
    <rect x="${marginX}" y="${eyebrowY}" width="${eyebrowW}" height="30" rx="15" fill="${p.accent}"/>
    <text x="${marginX + eyebrowW/2}" y="${eyebrowY + 20}" font-size="13" font-weight="700" fill="${p.bg}" text-anchor="middle" letter-spacing="1">${escXml(eyebrowText)}</text>

    <!-- headline -->
    <text x="${marginX}" y="${headlineStartY}" font-size="40" font-weight="900" fill="${p.text}" font-family="Archivo Black, sans-serif">
      ${headlineLines.map((line,i)=>`<tspan x="${marginX}" dy="${i===0?0:headlineLineH}">${escXml(line)}</tspan>`).join('')}
    </text>
    <rect x="${marginX}" y="${ruleY}" width="64" height="5" rx="2.5" fill="${p.accent2}"/>

    <!-- subheadline -->
    <text x="${marginX}" y="${subStartY}" font-size="16" fill="${p.text}" opacity="0.82">
      ${subLines.map((line,i)=>`<tspan x="${marginX}" dy="${i===0?0:subLineH}">${escXml(line)}</tspan>`).join('')}
    </text>

    <!-- stat: thin bar + big number, generous whitespace around it -->
    <rect x="${marginX}" y="${statBarY}" width="4" height="70" fill="${p.accent2}"/>
    <text x="${marginX+18}" y="${statNumberY}" font-size="50" font-weight="900" fill="${p.accent2}" font-family="Archivo Black, sans-serif">${escXml(data.stat_number||'')}</text>
    <text x="${marginX+18}" y="${statLabelY}" font-size="13" fill="${p.text}" opacity="0.7" letter-spacing="1">${escXml((data.stat_label||'').toUpperCase())}</text>

    <!-- cta -->
    <rect x="${marginX}" y="${ctaY}" width="${ctaW}" height="52" rx="26" fill="${p.accent}"/>
    <text x="${marginX + ctaW/2}" y="${ctaY + 33}" font-size="16" font-weight="700" fill="${p.bg}" text-anchor="middle">${escXml(ctaText)}</text>

    <!-- footer -->
    <line x1="${marginX}" y1="${dividerY}" x2="${W-marginX}" y2="${dividerY}" stroke="${p.text}" stroke-opacity="0.15"/>
    <text x="${marginX}" y="${footerY}" font-size="11.5" fill="${p.text}" opacity="0.55" letter-spacing="0.5">${escXml(data.footer||'')}</text>
    <circle cx="${W-marginX-4}" cy="${footerY-4}" r="3" fill="${p.accent}"/>
  </svg>`;
}

function renderPosterSet(posters){
  const wrap = document.createElement('div');

function downloadPoster(id){
  const svgEl = document.getElementById(id);
  if(!svgEl){ return; }
  try{
    const w = parseFloat(svgEl.getAttribute('width')) || 600;
    const h = parseFloat(svgEl.getAttribute('height')) || 750;
    const scale = 1200 / w;
    const outW = Math.round(w * scale);
    const outH = Math.round(h * scale);

    const svgData = new XMLSerializer().serializeToString(svgEl);
    const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
    const svgUrl = URL.createObjectURL(svgBlob);

    const triggerDownload = (href, filename) => {
      const a = document.createElement('a');
      a.href = href;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    const img = new Image();
    img.onload = function(){
      try{
        const canvas = document.createElement('canvas');
        canvas.width = outW;
        canvas.height = outH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, outW, outH);
        canvas.toBlob(function(blob){
          URL.revokeObjectURL(svgUrl);
          if(blob){
            const pngUrl = URL.createObjectURL(blob);
            triggerDownload(pngUrl, 'campaign-poster.png');
            setTimeout(()=>URL.revokeObjectURL(pngUrl), 4000);
          } else {
            // canvas export failed -- fall back to the SVG file itself
            const fallbackBlob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
            triggerDownload(URL.createObjectURL(fallbackBlob), 'campaign-poster.svg');
          }
        }, 'image/png');
      }catch(e){
        URL.revokeObjectURL(svgUrl);
        const fallbackBlob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
        triggerDownload(URL.createObjectURL(fallbackBlob), 'campaign-poster.svg');
        console.error('PNG export failed, downloaded SVG instead', e);
      }
    };
    img.onerror = function(){
      URL.revokeObjectURL(svgUrl);
      const fallbackBlob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
      triggerDownload(URL.createObjectURL(fallbackBlob), 'campaign-poster.svg');
    };
    img.src = svgUrl;
  }catch(err){
    console.error('Download failed', err);
    alert("The download hit a snag on my end -- try right-clicking the poster image and choosing \"Save image as\" instead!");
  }
}

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px;">${cells}</div>`;
  }

  const weeks = (data.periods||[]).map(p=>`
    <div style="background:#14142e;border:1px solid rgba(253,251,247,0.10);border-radius:12px;padding:14px 16px;margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;">
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;">${escXml(p.label)}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#4ecdc4;">${inlineMd(escXml(p.focus||''))}</div>
      </div>
      <ul style="margin:8px 0 0;padding-left:18px;">
        ${(p.actions||[]).map(a=>`<li style="margin-bottom:5px;font-size:13px;">${inlineMd(escXml(a))}</li>`).join('')}
      </ul>
    </div>`).join('');
  return `${brandNote}<h3>Weekly action plan</h3>${weeks}`;
}

function renderFeedbackChartHtml(data){
  const periods = data.periods || [];
  const social = data.social_engagement || [];
  const inPerson = data.in_person_engagement || [];
  const chartSvg = buildLineChartSvg(periods, social, inPerson, data.social_label, data.in_person_label);

  const listHtml = (arr)=> '<ul>' + (arr||[]).map(x=>`<li>${inlineMd(escXml(x))}</li>`).join('') + '</ul>';

  return `
    <div style="margin-bottom:18px;">${chartSvg}</div>
    <h3>What's working</h3>
    ${listHtml(data.effective)}
    <h3>What should change</h3>
    ${listHtml(data.change)}
    <h3>Verdict</h3>
    <p><strong>${inlineMd(escXml(data.verdict||''))}</strong></p>
  `;
}

function buildLineChartSvg(periods, s1, s2, label1, label2){
  const W=640, H=320, padL=46, padR=20, padT=20, padB=44;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxVal = Math.max(100, ...(s1||[]), ...(s2||[]));
  const n = periods.length || Math.max(s1.length, s2.length);
  const xFor = i => padL + (n<=1 ? 0 : (i/(n-1))*plotW);
  const yFor = v => padT + plotH - (v/maxVal)*plotH;

  const pathFor = (series)=> series.map((v,i)=> (i===0?'M':'L') + xFor(i).toFixed(1) + ',' + yFor(v).toFixed(1)).join(' ');
  const dotsFor = (series, color)=> series.map((v,i)=>`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3.5" fill="${color}"/>`).join('');

  const gridLines = [0,25,50,75,100].filter(v=>v<=maxVal).map(v=>{
    const y = yFor(v);
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#a7a7c9" stroke-opacity="0.15"/>
            <text x="${padL-8}" y="${y+4}" font-size="10" fill="#a7a7c9" text-anchor="end" font-family="JetBrains Mono, monospace">${v}</text>`;
  }).join('');

  const xLabels = periods.map((p,i)=>`<text x="${xFor(i).toFixed(1)}" y="${H-padB+18}" font-size="10" fill="#a7a7c9" text-anchor="middle" font-family="JetBrains Mono, monospace">${escXml(p)}</text>`).join('');

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#14142e;border:1px solid rgba(253,251,247,0.10);border-radius:12px;">
    ${gridLines}
    <path d="${pathFor(s1)}" fill="none" stroke="#4ecdc4" stroke-width="2.5"/>
    <path d="${pathFor(s2)}" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-dasharray="5,4"/>
    ${dotsFor(s1,'#4ecdc4')}
    ${dotsFor(s2,'#ff6b6b')}
    ${xLabels}
    <circle cx="${padL+8}" cy="${padT-4}" r="4" fill="#4ecdc4"/>
    <text x="${padL+18}" y="${padT}" font-size="11" fill="#fdfbf7" font-family="Inter, sans-serif">${escXml(label1||'Social media engagement')}</text>
    <circle cx="${padL+8}" cy="${padT+16}" r="4" fill="#ff6b6b"/>
    <text x="${padL+18}" y="${padT+20}" font-size="11" fill="#fdfbf7" font-family="Inter, sans-serif">${escXml(label2||'In-person engagement')}</text>
  </svg>`;
}

function openOverlay(title, html){
  document.getElementById('detailTitle').textContent = title;
  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('overlay').classList.remove('hidden');
}
function closeOverlay(){
  document.getElementById('overlay').classList.add('hidden');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeOverlay();
});
