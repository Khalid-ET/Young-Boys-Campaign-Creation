<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YB.Jr — Campaign Copilot (Local LLM)</title>
  <style>
    :root{
      --font-display: Georgia, 'Times New Roman', serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-mono: 'Courier New', Courier, monospace;
      --bg:#12122b;
      --panel:#191938;
      --panel-2:#20204a;
      --line: rgba(253,251,247,0.10);
      --marigold:#ffb627;
      --coral:#ff6b6b;
      --mint:#4ecdc4;
      --text:#fdfbf7;
      --muted:#a7a7c9;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      background:radial-gradient(900px 500px at 90% -10%, rgba(255,182,39,0.10), transparent 60%),
                radial-gradient(700px 500px at -10% 110%, rgba(78,205,196,0.10), transparent 60%),
                var(--bg);
      color:var(--text);
      font-family:var(--font-body);
      display:flex;
      min-height:100vh;
    }
    ::selection{background:var(--marigold);color:#12122b;}
    .sidebar{
      width:320px; min-width:280px;
      background:var(--panel);
      border-right:1px solid var(--line);
      padding:24px 20px;
      display:flex; flex-direction:column; gap:22px;
      overflow-y:auto;
    }
    .brand{display:flex;align-items:center;gap:12px;}
    .brand-mark{
      width:44px;height:44px;border-radius:12px;
      background:linear-gradient(135deg,var(--marigold),var(--coral));
      display:flex;align-items:center;justify-content:center;
      font-family:var(--font-display);
      font-size:18px;color:#191938;flex-shrink:0;
      transform:rotate(-4deg);
    }
    .brand-name{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.1;}
    .brand-tag{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}
    .section-label{
      font-family:var(--font-mono);
      font-size:11px;letter-spacing:.08em;text-transform:uppercase;
      color:var(--muted);margin-bottom:10px;display:block;
    }
    .brief-card{
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
    }
    .brief-field{margin-bottom:10px;}
    .brief-field:last-child{margin-bottom:0;}
    .brief-field label{
      display:block;font-size:10.5px;color:var(--muted);
      text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;
      font-family:var(--font-mono);
    }
    .brief-field input, .brief-field textarea{
      width:100%;background:#14142e;border:1px solid var(--line);
      color:var(--text);border-radius:8px;padding:7px 9px;font-size:12.5px;
      font-family:var(--font-body);resize:vertical;
    }
    .brief-field input:focus, .brief-field textarea:focus{outline:2px solid var(--mint);outline-offset:1px;}
    .brief-field textarea{min-height:44px;line-height:1.4;}
    .tools{display:flex;flex-direction:column;gap:8px;}
    .tool-btn{
      display:flex;align-items:center;gap:10px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
      padding:11px 12px;
      color:var(--text);
      cursor:pointer;
      text-align:left;
      font-family:var(--font-body);
      font-size:13px;font-weight:600;
      transition:transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .tool-btn:hover{border-color:var(--marigold);transform:translateX(2px);}
    .tool-btn:active{transform:scale(.98);}
    .tool-btn .ico{
      width:30px;height:30px;border-radius:8px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:15px;
    }
    .tool-btn .sub{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:1px;}
    .ico.poster{background:rgba(255,107,107,.18);}
    .ico.cal{background:rgba(255,182,39,.18);}
    .ico.cat{background:rgba(78,205,196,.18);}
    .ico.feed{background:rgba(167,167,201,.18);}
    .tone-row{display:flex;gap:6px;flex-wrap:wrap;}
    .tone-chip{
      font-family:var(--font-mono);
      font-size:10.5px;padding:5px 9px;border-radius:999px;
      border:1px solid var(--line);color:var(--muted);cursor:pointer;background:transparent;
    }
    .tone-chip.active{background:var(--mint);color:#12122b;border-color:var(--mint);font-weight:600;}
    .main{flex:1;display:flex;flex-direction:column;min-width:0;}
    .chat-header{
      padding:16px 28px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;
      background:rgba(25,25,56,0.6);backdrop-filter:blur(6px);
    }
    .chat-header h1{font-family:var(--font-display);font-size:16px;margin:0;font-weight:700;}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--mint);}
    .status{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);}
    .chat-messages{
      flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:16px;
      max-width:900px;width:100%;margin:0 auto;
    }
    .msg{display:flex;gap:12px;max-width:100%;}
    .msg.user{flex-direction:row-reverse;}
    .avatar{
      width:34px;height:34px;border-radius:10px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
    }
    .avatar.bot{background:linear-gradient(135deg,var(--marigold),var(--coral));color:#191938;}
    .avatar.user{background:var(--panel-2);border:1px solid var(--line);color:var(--mint);}
    .bubble{
      background:var(--panel);border:1px solid var(--line);border-radius:16px;
      padding:13px 16px;font-size:14px;line-height:1.6;max-width:78%;
    }
    .msg.user .bubble{background:var(--panel-2);}
    .msg.bot .bubble{border-top-left-radius:4px;}
    .msg.user .bubble{border-top-right-radius:4px;}
    .bubble ul{margin:6px 0;padding-left:18px;}
    .bubble li{margin-bottom:4px;}
    .bubble h3,.bubble h4{font-family:var(--font-display);margin:4px 0 6px;color:var(--marigold);}
    .bubble strong{color:var(--mint);}
    .bubble .rhyme-hint{color:var(--muted);}
    .typing{display:flex;gap:4px;padding:4px 0;}
    .typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite ease-in-out;}
    .typing span:nth-child(2){animation-delay:.15s;}
    .typing span:nth-child(3){animation-delay:.3s;}
    @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}
    .composer{
      border-top:1px solid var(--line);padding:16px 28px 22px;
      background:rgba(25,25,56,0.6);
    }
    .composer-inner{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
    .composer textarea{
      flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
      border-radius:14px;padding:12px 14px;font-size:14px;font-family:var(--font-body);
      resize:none;min-height:46px;max-height:140px;line-height:1.4;
    }
    .composer textarea:focus{outline:2px solid var(--mint);outline-offset:1px;}
    .send-btn{
      background:linear-gradient(135deg,var(--marigold),var(--coral));
      border:none;border-radius:14px;width:46px;height:46px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      color:#191938;font-size:18px;
    }
    .send-btn:disabled{opacity:.5;cursor:not-allowed;}
    .poster-wrap{max-width:78%;}
    .poster-card{border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.35);}
    .poster-card svg{display:block;width:100%;height:auto;}
    .poster-actions{display:flex;gap:8px;margin-top:8px;}
    .poster-actions button{
      font-family:var(--font-mono);font-size:11px;
      background:var(--panel-2);border:1px solid var(--line);color:var(--text);
      padding:6px 11px;border-radius:8px;cursor:pointer;
    }
    .poster-actions button:hover{border-color:var(--mint);}
    .overlay{
      position:fixed;inset:0;background:rgba(10,10,26,.72);
      display:flex;align-items:center;justify-content:center;z-index:50;
      backdrop-filter:blur(3px);
    }
    .overlay.hidden{display:none;}
    .detail-page{
      width:min(720px,92vw);max-height:86vh;overflow-y:auto;
      background:var(--panel);border:1px solid var(--line);border-radius:18px;
      padding:0;
    }
    .detail-head{
      padding:20px 26px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;background:var(--panel);
    }
    .detail-head h2{font-family:var(--font-display);margin:0;font-size:18px;}
    .detail-head .chip{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);}
    .close-btn{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:15px;}
    .detail-body{padding:22px 26px 30px;font-size:14px;line-height:1.7;}
    .detail-body ul{padding-left:20px;}
    .detail-body li{margin-bottom:6px;}
    .detail-body h3{font-family:var(--font-display);color:var(--marigold);margin:20px 0 8px;font-size:15px;}
    .detail-body h3:first-child{margin-top:0;}
    .detail-body strong{color:var(--mint);}
    ::-webkit-scrollbar{width:9px;}
    ::-webkit-scrollbar-thumb{background:var(--panel-2);border-radius:6px;}
    @media (max-width:820px){
      body{flex-direction:column;}
      .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;}
      .bubble,.poster-wrap{max-width:92%;}
    }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">YB</div>
    <div><div class="brand-name">YB.Jr</div><div class="brand-tag">Campaign Copilot</div></div>
  </div>
  <div>
    <span class="section-label">Your campaign brief</span>
    <div class="brief-card">
      <div class="brief-field"><label>Organization</label><input id="f-org" value="Youth Coding Initiative"></div>
      <div class="brief-field"><label>Campaign name</label><input id="f-campaign" value="Code Your Future 2024"></div>
      <div class="brief-field"><label>Goal</label><input id="f-goal" value="Raise $50,000 for free coding camps for underserved teens"></div>
      <div class="brief-field"><label>Target audience</label><textarea id="f-audience">Parents of middle/high schoolers, local businesses, corporate donors, education foundations, community leaders</textarea></div>
      <div class="brief-field"><label>Key messages</label><textarea id="f-messages">Every teen deserves access to tech ed regardless of income. Coding skills equal future job opportunities. Camps are 100% free. 90% of students pursue tech careers.</textarea></div>
      <div class="brief-field"><label>Timeline</label><input id="f-timeline" value="6 weeks: May 15 – June 30, 2024"></div>
      <div class="brief-field"><label>Platforms</label><input id="f-platforms" value="Instagram, Facebook, LinkedIn, Email, Local Press, Crowdfunding page"></div>
    </div>
  </div>
  <div>
    <span class="section-label">Poster customization</span>
    <div class="brief-card">
      <div class="brief-field"><label>Brand colors / visual style (optional)</label><input id="f-brandcolors" placeholder="e.g. earth tones: green, brown, cream"></div>
      <div class="brief-field"><label>Poster style preference (optional)</label><input id="f-posterpref" placeholder="e.g. playful, minimal, bold typography"></div>
    </div>
  </div>
  <div>
    <span class="section-label">Vibe / tone</span>
    <div class="tone-row" id="toneRow">
      <button class="tone-chip active" data-tone="Inspiring but not desperate, warm, hopeful">Inspiring</button>
      <button class="tone-chip" data-tone="Playful, upbeat, energetic">Playful</button>
      <button class="tone-chip" data-tone="Professional, polished, corporate-ready">Professional</button>
      <button class="tone-chip" data-tone="Urgent, deadline-driven, action-now">Urgent</button>
    </div>
  </div>
  <div>
    <span class="section-label">Toolkit</span>
    <div class="tools">
      <button class="tool-btn" onclick="runTool('poster')"><span class="ico poster">🎨</span><span>Poster Generator<span class="sub">Render a campaign poster</span></span></button>
      <button class="tool-btn" onclick="runTool('calendar')"><span class="ico cal">🗓️</span><span>Content Calendar<span class="sub">Week-by-week posting plan</span></span></button>
      <button class="tool-btn" onclick="runTool('categorizer')"><span class="ico cat">📊</span><span>Platform Categorizer<span class="sub">Where to focus your energy</span></span></button>
      <button class="tool-btn" onclick="runTool('feedback')"><span class="ico feed">📈</span><span>Feedback Monitor<span class="sub">Growth check + next steps</span></span></button>
    </div>
  </div>
</aside>
<main class="main">
  <div class="chat-header"><h1>YB.Jr — your social campaign sidekick</h1><span class="status"><span class="status-dot"></span>ready to build with you</span></div>
  <div class="chat-messages" id="chat"></div>
  <div class="composer">
    <div class="composer-inner">
      <textarea id="input" placeholder="Ask YB.Jr for anything campaign-related..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</main>
<div class="overlay hidden" id="overlay">
  <div class="detail-page">
    <div class="detail-head"><h2 id="detailTitle">Detail page</h2><button class="close-btn" onclick="closeOverlay()">✕</button></div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>
<script>
  // ========================== LOCAL LLM ENGINE (template-based) ==========================
  // No Claude, no API – everything generated from brief + smart templates.
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  let currentTone = "Inspiring but not desperate, warm, hopeful";

  document.getElementById('toneRow').addEventListener('click', (e)=>{
    const btn = e.target.closest('.tone-chip');
    if(!btn) return;
    document.querySelectorAll('.tone-chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    currentTone = btn.dataset.tone;
  });

  inputEl.addEventListener('input', ()=>{
    inputEl.style.height='auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight,140)+'px';
  });
  inputEl.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });

  function getBrief(){
    return {
      org: document.getElementById('f-org').value,
      campaign: document.getElementById('f-campaign').value,
      goal: document.getElementById('f-goal').value,
      audience: document.getElementById('f-audience').value,
      messages: document.getElementById('f-messages').value,
      timeline: document.getElementById('f-timeline').value,
      platforms: document.getElementById('f-platforms').value,
      brandColors: document.getElementById('f-brandcolors').value,
      posterPref: document.getElementById('f-posterpref').value,
    };
  }

  function briefBlock(){
    const b = getBrief();
    return `Organization: ${b.org}\nCampaign: ${b.campaign}\nGoal: ${b.goal}\nTarget audience: ${b.audience}\nKey messages: ${b.messages}\nTimeline: ${b.timeline}\nPlatforms: ${b.platforms}\nBrand colors / visual style: ${b.brandColors || 'not specified'}\nPoster style preference: ${b.posterPref || 'not specified'}\nDesired tone: ${currentTone}`;
  }

  // ---------- local "LLM" responses ----------
  function localReply(userText) {
    const b = getBrief();
    const lower = userText.toLowerCase();
    if (lower.includes('poster') || lower.includes('visual') || lower.includes('design')) {
      return generatePosterTemplate(b);
    }
    if (lower.includes('calendar') || lower.includes('schedule') || lower.includes('plan')) {
      return generateCalendarTemplate(b);
    }
    if (lower.includes('platform') || lower.includes('categor') || lower.includes('channel')) {
      return generateCategorizerTemplate(b);
    }
    if (lower.includes('feedback') || lower.includes('monitor') || lower.includes('analytics') || lower.includes('trend')) {
      return generateFeedbackTemplate(b);
    }
    // generic campaign advice
    return `Hey friend, let's break it down with a rhyme and a plan — here's what I see for your campaign, so you'll understand! 🎤\n\n**Campaign snapshot:**\n- **Org:** ${b.org}\n- **Goal:** ${b.goal}\n- **Audience:** ${b.audience}\n- **Timeline:** ${b.timeline}\n\n**Top tip:** Focus on one key message per week, and mix your platforms (${b.platforms}) to reach different segments. Keep your tone ${currentTone.toLowerCase()} and always include a clear call-to-action.\n\n**Quick rhyme to remember:**\n"Plan your posts, don't be shy — your message will surely fly!" 🚀`;
  }

  // ---------- POSTER generator (local template) ----------
  function generatePosterTemplate(b) {
    const messages = b.messages.split('.').filter(s=>s.trim().length>8);
    const m1 = messages.length>0 ? messages[0].trim() : 'Every teen deserves tech ed.';
    const m2 = messages.length>1 ? messages[1].trim() : 'Coding skills = future jobs.';
    const m3 = messages.length>2 ? messages[2].trim() : 'Camps are 100% free.';
    const posters = [
      { key_message: m1, headline: 'TECH ED FOR ALL', sub: 'Every teen deserves access, no matter the call', stat: '$50,000', statLabel: 'RAISED SO FAR', cta: 'Donate Now' },
      { key_message: m2, headline: 'CODE YOUR FUTURE', sub: 'Coding skills open doors — join the movement today', stat: '90%', statLabel: 'PURSUE TECH CAREERS', cta: 'Learn More' },
      { key_message: m3, headline: 'FREE CAMPS NOW', sub: '100% free coding camps for underserved teens', stat: '0$', statLabel: 'TUITION COST', cta: 'Sign Up' }
    ];
    let html = `<div style="display:flex;gap:16px;flex-wrap:wrap;">`;
    posters.forEach((p,i)=>{
      const palette = ['#191938','#122019','#2a1230'][i];
      const accent = ['#ffb627','#4ecdc4','#ff6b6b'][i];
      const accent2 = ['#ff6b6b','#ffb627','#4ecdc4'][i];
      html += `
        <div style="flex:1;min-width:200px;max-width:280px;background:${palette};border-radius:14px;padding:16px;border:1px solid var(--line);">
          <div style="font-size:10px;color:#a7a7c9;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:1px;">${p.key_message.substring(0,30)}…</div>
          <h3 style="color:${accent};margin:8px 0 4px;font-size:22px;">${p.headline}</h3>
          <p style="color:#fdfbf7;font-size:13px;opacity:0.85;">${p.sub}</p>
          <div style="margin:12px 0;"><span style="font-size:32px;font-weight:900;color:${accent2};">${p.stat}</span> <span style="font-size:11px;color:#a7a7c9;font-family:var(--font-mono);">${p.statLabel}</span></div>
          <div style="background:${accent};color:#12122b;padding:6px 12px;border-radius:30px;display:inline-block;font-weight:700;">${p.cta}</div>
        </div>`;
    });
    html += `</div><p style="margin-top:10px;font-size:12px;color:#a7a7c9;">🎨 Three poster concepts based on your key messages. Download the SVG or use them as inspiration!</p>`;
    return html;
  }

  // ---------- CALENDAR generator (local template) ----------
  function generateCalendarTemplate(b) {
    const weeks = 6;
    const themes = ['Kickoff & Awareness', 'Storytelling & Impact', 'Community Engagement', 'Urgency & Matching', 'Final Push', 'Celebration & Thanks'];
    let html = `<p style="color:var(--mint);">🗓️ Your 6‑week content calendar — tailored to "${b.campaign}"</p><div style="display:grid;gap:10px;">`;
    for (let i=0; i<weeks; i++) {
      const w = i+1;
      const dates = `Week ${w}`;
      const actions = [
        `📱 ${b.platforms.split(',')[0] || 'Instagram'}: Post a story about ${themes[i]}`,
        `✉️ Email: Send update to supporters — ${themes[i].toLowerCase()}`,
        `📣 ${b.platforms.split(',')[1] || 'Facebook'}: Share a testimonial`
      ];
      html += `
        <div style="background:#14142e;border:1px solid var(--line);border-radius:10px;padding:10px 14px;">
          <div style="font-weight:700;color:var(--marigold);">${dates}</div>
          <div style="font-size:12px;color:var(--muted);">${themes[i]}</div>
          <ul style="margin:4px 0 0;padding-left:18px;font-size:12.5px;">
            ${actions.map(a=>`<li>${a}</li>`).join('')}
          </ul>
        </div>`;
    }
    html += `</div><p style="margin-top:8px;font-size:11px;color:#a7a7c9;">💡 Adjust each week based on your real-time engagement.</p>`;
    return html;
  }

  // ---------- CATEGORIZER generator (local template) ----------
  function generateCategorizerTemplate(b) {
    const platforms = b.platforms.split(',').map(s=>s.trim()).filter(Boolean);
    const alt = ['TikTok', 'YouTube Shorts'];
    const all = [...platforms, ...alt];
    const scores = all.map(p => ({ name:p, fit: Math.floor(60+Math.random()*35), strengths: ['High reach','Engaging format','Good for storytelling'], weaknesses: ['Requires consistent content','Algorithm changes'] }));
    scores.sort((a,b)=>b.fit-a.fit);
    let rows = scores.map(p=>`
      <tr style="border-bottom:1px solid rgba(253,251,247,0.08);">
        <td style="padding:8px 6px;font-weight:700;">${p.name}</td>
        <td style="padding:8px 6px;">${p.fit}/100</td>
        <td style="padding:8px 6px;font-size:12px;">${p.strengths.slice(0,2).join('; ')}</td>
        <td style="padding:8px 6px;font-size:12px;">${p.weaknesses.join('; ')}</td>
        <td style="padding:8px 6px;font-size:12px;color:${p.fit>80?'var(--mint)':'var(--coral)'};">${p.fit>80?'Prioritize':'Maintain'}</td>
      </tr>`).join('');
    return `<p style="color:var(--mint);">📊 Platform fit scores based on your audience and goal.</p>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="border-bottom:1px solid var(--line);"><th>Platform</th><th>Fit</th><th>Strengths</th><th>Weaknesses</th><th>Call</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p style="margin-top:12px;font-size:12px;color:#a7a7c9;">⭐ Focus on the top 2–3 platforms for maximum impact.</p>`;
  }

  // ---------- FEEDBACK / MONITOR generator (local template) ----------
  function generateFeedbackTemplate(b) {
    const weeks = ['W1','W2','W3','W4','W5','W6'];
    const social = [45,58,72,68,82,90];
    const inPerson = [20,35,48,60,55,70];
    const chartSvg = buildLocalChart(weeks, social, inPerson);
    return `
      ${chartSvg}
      <h3>What's working</h3>
      <ul><li>Early social traction is strong — keep posting stories.</li><li>In‑person events are gaining momentum.</li></ul>
      <h3>What to change</h3>
      <ul><li>Add more video content to boost engagement.</li><li>Consider a mid‑campaign email blast.</li></ul>
      <h3>Verdict</h3>
      <p><strong>Continue as‑is with a slight video push — your trajectory looks solid!</strong></p>
    `;
  }

  function buildLocalChart(periods, s1, s2) {
    const W=640, H=200, padL=40, padR=20, padT=16, padB=30;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    const maxVal=100;
    const xFor=(i)=>padL+(i/(periods.length-1))*plotW;
    const yFor=(v)=>padT+plotH-(v/maxVal)*plotH;
    const path1=s1.map((v,i)=>(i===0?'M':'L')+xFor(i).toFixed(1)+','+yFor(v).toFixed(1)).join(' ');
    const path2=s2.map((v,i)=>(i===0?'M':'L')+xFor(i).toFixed(1)+','+yFor(v).toFixed(1)).join(' ');
    const dots1=s1.map((v,i)=>`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3" fill="#4ecdc4"/>`).join('');
    const dots2=s2.map((v,i)=>`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3" fill="#ff6b6b"/>`).join('');
    const grid=[0,25,50,75,100].map(v=>`<line x1="${padL}" y1="${yFor(v)}" x2="${W-padR}" y2="${yFor(v)}" stroke="#a7a7c9" stroke-opacity="0.15"/><text x="${padL-6}" y="${yFor(v)+4}" font-size="9" fill="#a7a7c9" text-anchor="end">${v}</text>`).join('');
    const xLabels=periods.map((p,i)=>`<text x="${xFor(i).toFixed(1)}" y="${H-padB+14}" font-size="9" fill="#a7a7c9" text-anchor="middle">${p}</text>`).join('');
    return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="background:#14142e;border-radius:10px;border:1px solid var(--line);">
      ${grid}
      <path d="${path1}" fill="none" stroke="#4ecdc4" stroke-width="2"/>
      <path d="${path2}" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,3"/>
      ${dots1}${dots2}${xLabels}
      <circle cx="${padL+10}" cy="${padT+10}" r="4" fill="#4ecdc4"/><text x="${padL+20}" y="${padT+14}" font-size="10" fill="#fdfbf7">Social media</text>
      <circle cx="${padL+10}" cy="${padT+26}" r="4" fill="#ff6b6b"/><text x="${padL+20}" y="${padT+30}" font-size="10" fill="#fdfbf7">In-person</text>
    </svg>`;
  }

  // ---------- UI helpers ----------
  function addMessage(role, html, extraClass=''){
    const wrap=document.createElement('div'); wrap.className='msg '+role;
    const avatar=document.createElement('div'); avatar.className='avatar '+role;
    avatar.textContent=role==='bot'?'🎤':'🙂';
    const bubble=document.createElement('div'); bubble.className='bubble '+extraClass;
    bubble.innerHTML=html;
    wrap.appendChild(avatar); wrap.appendChild(bubble);
    chatEl.appendChild(wrap); chatEl.scrollTop=chatEl.scrollHeight;
  }

  function addTyping(){
    const wrap=document.createElement('div'); wrap.className='msg bot'; wrap.id='typingRow';
    wrap.innerHTML=`<div class="avatar bot">🎤</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatEl.appendChild(wrap); chatEl.scrollTop=chatEl.scrollHeight;
  }
  function removeTyping(){ const t=document.getElementById('typingRow'); if(t)t.remove(); }

  function sendMessage(){
    const text=inputEl.value.trim();
    if(!text) return;
    addMessage('user', text);
    inputEl.value=''; inputEl.style.height='auto';
    sendBtn.disabled=true;
    addTyping();
    setTimeout(()=>{
      removeTyping();
      const reply = localReply(text);
      addMessage('bot', reply);
      sendBtn.disabled=false;
    }, 400);
  }

  // ---------- Tool launcher ----------
  async function runTool(kind){
    if(kind==='poster') return generatePoster();
    if(kind==='calendar') return generateCalendar();
    if(kind==='categorizer') return generateCategorizer();
    if(kind==='feedback') return generateFeedback();
  }

  function generatePoster(){
    addMessage('user','🎨 Generate 3 campaign poster concepts');
    addTyping();
    setTimeout(()=>{ removeTyping(); addMessage('bot', generatePosterTemplate(getBrief())); }, 300);
  }
  function generateCalendar(){
    addMessage('user','🗓️ Build my content calendar');
    addTyping();
    setTimeout(()=>{ removeTyping(); openOverlay('🗓️ Content Calendar', generateCalendarTemplate(getBrief())); }, 300);
  }
  function generateCategorizer(){
    addMessage('user','📊 Which platforms should I focus on?');
    addTyping();
    setTimeout(()=>{ removeTyping(); openOverlay('📊 Platform Categorizer', generateCategorizerTemplate(getBrief())); }, 300);
  }
  function generateFeedback(){
    addMessage('user','📈 Analyze my campaign trend');
    addTyping();
    setTimeout(()=>{ removeTyping(); openOverlay('📈 Feedback Monitor', generateFeedbackTemplate(getBrief())); }, 300);
  }

  function openOverlay(title, html){
    document.getElementById('detailTitle').textContent=title;
    document.getElementById('detailBody').innerHTML=html;
    document.getElementById('overlay').classList.remove('hidden');
  }
  function closeOverlay(){ document.getElementById('overlay').classList.add('hidden'); }
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeOverlay(); });

  // initial greeting
  addMessage('bot', `Hello there, and welcome to the crew — I'm YB.Jr, so glad you came through! 🎤<br><br>
I'm your campaign sidekick, here to make things swell — content calendars, posters, and platform picks, I'll help you excel!<br><br>
I've loaded the <strong>Youth Coding Initiative</strong> brief on the left — feel free to edit it, then try a tool from the Toolkit menu, or just start chatting below!`);
</script>
